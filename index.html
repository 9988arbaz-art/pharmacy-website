<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bihar College of Pharmacy | Official Patna</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; color: #333; overflow-x: hidden; }

        /* Top Bar */
        .top-bar { background: #ffcc00; color: #002147; padding: 8px 5%; text-align: right; font-weight: bold; font-size: 12px; }

        /* Navigation */
        nav { background: #002147; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; }
        .logo h1 { color: white; font-size: 20px; letter-spacing: 1px; }
        .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 13px; text-transform: uppercase; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: #ffcc00; }

        /* Hero Section */
        .hero { 
            background: linear-gradient(rgba(0,33,102,0.75), rgba(0,33,102,0.75)), url('https://images.unsplash.com/photo-1563213126-a428448497bd?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-position: center;
            height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
        }
        .hero h2 { font-size: clamp(24px, 5vw, 40px); margin-bottom: 10px; }
        .btn-enquiry { background: #ffcc00; color: #002147; padding: 12px 30px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; margin-top: 15px; transition: 0.3s; }
        .btn-enquiry:hover { background: white; transform: scale(1.05); }

        /* Photo Gallery Section */
        .section { padding: 50px 5%; text-align: center; }
        .section h2 { color: #002147; margin-bottom: 30px; border-bottom: 3px solid #ffcc00; display: inline-block; padding-bottom: 5px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .gallery-item { height: 220px; border-radius: 8px; overflow: hidden; background: #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .gallery-item img:hover { transform: scale(1.1); }

        /* Contact & Form Section */
        .contact-flex { display: flex; flex-wrap: wrap; gap: 30px; padding: 50px 5%; background: white; }
        .form-box { flex: 1; min-width: 300px; }
        .form-box h2 { margin-bottom: 20px; color: #002147; font-size: 28px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; font-size: 14px; }
        .btn-send { background: #002147; color: white; border: none; padding: 14px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn-send:hover { background: #004080; }

        .map-box { flex: 1; min-width: 300px; height: 380px; border-radius: 8px; overflow: hidden; border: 4px solid #eee; }

        footer { background: #002147; color: white; text-align: center; padding: 30px; margin-top: 30px; border-top: 5px solid #ffcc00; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            nav { justify-content: center; }
            .nav-links { margin-top: 15px; }
            .nav-links a { margin: 0 8px; font-size: 12px; }
            .top-bar { text-align: center; font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="top-bar">📍 Sahay Nagar, Phulwari Sharif, Patna | 📞 0612-2250553</div>

<nav>
    <div class="logo"><h1>BCP PATNA</h1></div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Admission</a>
    </div>
</nav>

<div class="hero">
    <h2>Excellence In Pharmacy</h2>
    <p>Empowering Students with Quality Education in Bihar.</p>
    <a href="#contact" class="btn-enquiry">APPLY NOW</a>
</div>

<section id="gallery" class="section">
    <h2>College Gallery</h2>
    <div class="gallery-grid">
        <div class="gallery-item"><img src="https://biharcollegeofpharmacy.com/wp-content/uploads/2021/04/college-building.jpg" alt="Building"></div>
        <div class="gallery-item"><img src="https://images.unsplash.com/photo-1581093458791-9f3c3900df4b?auto=format&fit=crop&w=500&q=60" alt="Lab"></div>
        <div class="gallery-item"><img src="https://images.unsplash.com/photo-1576086213369-97a306d36557?auto=format&fit=crop&w=500&q=60" alt="Research"></div>
    </div>
</section>

<section id="contact" class="contact-flex">
    <div class="form-box">
        <h2>Admission Enquiry</h2>
        <form action="https://formspree.io/f/mqakppww" method="POST">
            <input type="hidden" name="_replyto" value="9988arbaz@gmail.com">
            <input type="text" name="name" placeholder="Student Full Name" required>
            <input type="email" name="email" placeholder="Your Email Address" required>
            <input type="text" name="phone" placeholder="Mobile Number" required>
            <textarea name="message" rows="4" placeholder="Which course (B.Pharm/D.Pharm) are you interested in?" required></textarea>
            <button type="submit" class="btn-send">Submit Enquiry</button>
        </form>
    </div>

    <div class="map-box">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3598.665516901306!2d85.048866575191!3d25.582798977465372!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39ed579f15555555%3A0x6b777a167d4e3e3b!2sBihar%20College%20of%20Pharmacy!5e0!3m2!1sen!2sin!4v1715714000000!5m2!1sen!2sin" 
        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
</section>

<footer>
    <p>© 2026 Bihar College of Pharmacy. Developed by Arbaz Alam.</p>
</footer>

</body>
</html>
